name: Build Octopus Linux Raw Disk

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Btrfs Kernel Module
        run: |
          sudo modprobe btrfs
          sudo lsmod | grep btrfs

      - name: Log in to GitHub Container Registry for root Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      # Step 1: Build & Push the OCI Container Image using sudo
      - name: Build and push Container image
        run: |
          LOWER_IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ env.REGISTRY }}/${LOWER_IMAGE_NAME}:latest"
          
          # Build and push directly via sudo podman so it lands in root storage (/var/lib/containers/storage)
          sudo podman build -t $TAG -f ./Containerfile .
          sudo podman push $TAG
          
          echo "FINAL_IMAGE_TAG=$TAG" >> $GITHUB_ENV

      # Step 2: Convert the Container Image into a .raw Disk Image
      - name: Build Raw Disk Image
        run: |
          mkdir -p ${{ github.workspace }}/output
          
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ${{ github.workspace }}/output:/output \
            -v ${{ github.workspace }}/config.toml:/config.toml:ro \
            quay.io/osbuild/image-builder:latest \
            build \
            --type raw \
            --target-arch x86_64 \
            --rootfs btrfs \
            --config /config.toml \
            --bootc-ref ${{ env.FINAL_IMAGE_TAG }}

      # Step 3: Upload the built raw image
      - name: Upload Raw Disk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-raw-disk
          path: ${{ github.workspace }}/output/image/disk.raw
