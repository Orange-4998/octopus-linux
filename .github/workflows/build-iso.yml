name: Build Octopus Linux Raw Disk

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Btrfs Kernel Module
        run: |
          sudo modprobe btrfs
          sudo lsmod | grep btrfs

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 1: Build & Push the OCI Container Image (Used for live bootc upgrades)
      - name: Build and Push Container Image
        run: |
          # Safely downcase repository name
          LOWER_IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ env.REGISTRY }}/${LOWER_IMAGE_NAME}:latest"
          
          # Build the bootc OS container image
          docker build -t $TAG -f ./Containerfile .
          docker push $TAG
          
          # Pass tag to downstream steps
          echo "FINAL_IMAGE_TAG=$TAG" >> $GITHUB_ENV

      # Step 2: Convert the Container Image into a .raw Disk Image using Privileged Execution
      - name: Build Raw Disk Image
        run: |
          mkdir -p ${{ github.workspace }}/output
          
          # Run bootc-image-builder in a fully privileged container to bypass GHA sandbox restrictions
          sudo podman run \
            --rm \
            --privileged \
            --security-opt label=disable \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ${{ github.workspace }}/output:/output \
            -v ${{ github.workspace }}/config.toml:/config.toml:ro \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build \
            --type raw \
            --target-arch x86_64 \
            --rootfs btrfs \
            --config /config.toml \
            ${{ env.FINAL_IMAGE_TAG }}

      # Step 3: Upload the built raw image so users can download it
      - name: Upload Raw Disk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: octopus-linux-raw-disk
          path: ${{ github.workspace }}/output/image/disk.raw
